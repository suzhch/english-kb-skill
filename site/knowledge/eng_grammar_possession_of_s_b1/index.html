  <script>
    window.KB_DETAIL = {"generatedAt":"2026-08-15T14:36:06.942Z","id":"eng_grammar_possession_of_s_b1","point":{"id":"eng_grammar_possession_of_s_b1","log":{"ts":"2026-08-14T16:47:40+09:00","action":"CREATED","artifactType":"KNOWLEDGE_POINT","id":"eng_grammar_possession_of_s_b1","file":"base/eng_grammar_possession_of_s_b1.json","createdAt":"2026-08-12T14:30:00+09:00","category":"GRAMMAR","subcategory":"POSSESSION","difficulty":"B1"},"content":{"id":"eng_grammar_possession_of_s_b1","category":"GRAMMAR","subcategory":"POSSESSION","difficulty":"B1","targetAgeMin":12,"targetAgeMax":18,"targetAgeGroup":"teen","tags":["possession","possessive","of","'s","s apostrophe","possessive adjectives","possessive pronouns","noun phrases","middle school"],"definition":{"name":"Expressing possession with 's, s', of, and possessive forms","description":"English shows possession or belonging in several ways. Use 's or s' mainly with people, animals, groups, and time expressions. Use of mainly with things, parts, abstract ideas, and longer noun phrases. Use possessive adjectives such as my, your, his, her, its, our, and their before nouns, and possessive pronouns such as mine, yours, his, hers, ours, and theirs without a following noun."},"examples":[{"english":"This is Anna's notebook.","translation":"This is Anna's notebook.","note":"Use 's after a singular person's name."},{"english":"The students' projects are on the wall.","translation":"The students' projects are on the wall.","note":"Use s' after a regular plural noun ending in -s."},{"english":"The children's bags are in the classroom.","translation":"The children's bags are in the classroom.","note":"Use 's after an irregular plural noun that does not end in -s."},{"english":"The color of the door is dark green.","translation":"The color of the door is dark green.","note":"Use of for a part, feature, or quality of a thing."},{"english":"The end of the story surprised me.","translation":"The end of the story surprised me.","note":"Use of for abstract relationships such as the end of a story."},{"english":"My phone is new, but yours is newer.","translation":"My phone is new, but yours is newer.","note":"My comes before a noun; yours replaces your phone."},{"english":"A friend of my brother's is visiting us.","translation":"A friend of my brother's is visiting us.","note":"A friend of my brother's means one of my brother's friends."},{"english":"Yesterday's meeting was short.","translation":"Yesterday's meeting was short.","note":"Use 's with some time expressions."}],"expressions":[{"expression":"Anna's notebook / my teacher's car / Tom's sister","meaning":"belonging to one person or closely connected with one person","register":"neutral","scenario":"talking about people and their things or relationships"},{"expression":"the students' projects / my parents' house","meaning":"belonging to more than one person when the plural noun ends in -s","register":"neutral","scenario":"talking about groups and families"},{"expression":"the children's toys / men's shoes / women's clothes","meaning":"belonging to an irregular plural noun","register":"neutral","scenario":"talking about plural groups whose noun form does not end in -s"},{"expression":"the roof of the house / the title of the book / the result of the test","meaning":"a part, feature, name, or result connected with a thing or idea","register":"neutral","scenario":"describing objects, texts, events, and abstract ideas"},{"expression":"my bag / your idea / his bike / her room / its tail / our class / their team","meaning":"possessive adjectives used before nouns","register":"neutral","scenario":"saying who something belongs to"},{"expression":"mine / yours / his / hers / ours / theirs","meaning":"possessive pronouns used without a following noun","register":"neutral","scenario":"avoiding repeated nouns"}],"relatedTopics":["eng_grammar_pronouns_subject_object_a1","eng_grammar_nouns_singular_plural_a1","eng_grammar_articles_common_nouns_a2","eng_grammar_noun_phrases_b1"],"source":null,"createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null},"hasContent":true,"learningAssetCount":19,"assetStrategies":["CLASSIFICATION","EXPLANATION","COMPARISON","ASSOCIATION","EXAMPLE","COUNTER_EXAMPLE","CONFUSION","SCENARIO","DIALOGUE","MNEMONIC","PRODUCTION","EXTENSION"]},"assets":[{"id":"asset_eng_grammar_possession_of_s_b1_classification","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"CLASSIFICATION","title":"Grammar category","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"classification":{"parent":"Noun phrases and possessive structures","reason":"Possession is expressed inside noun phrases with possessive nouns, of-phrases, possessive adjectives, and possessive pronouns."}},{"id":"asset_eng_grammar_possession_of_s_b1_explanation","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXPLANATION","title":"Core rule","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"explanation":{"myUnderstanding":"Use 's for one person or irregular plural owners: Anna's bag, the children's room. Use s' for regular plural owners ending in -s: the students' desks. Use of for parts, features, abstract ideas, and long noun phrases: the cover of the book, the result of the exam. Use my, your, his, her, its, our, and their before nouns; use mine, yours, his, hers, ours, and theirs when the noun is not repeated."}},{"id":"asset_eng_grammar_possession_of_s_b1_comparison_s_of","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"COMPARISON","title":"'s vs of","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"comparison":{"compareWith":"'s and of","similarities":["Both can connect two nouns.","Both can show possession, belonging, part-whole relationships, or close connection."],"differences":["'s is usually natural with people, animals, groups, organizations, and time expressions.","Of is usually natural with things, parts of things, qualities, results, titles, and abstract ideas.","'s puts the owner before the thing owned; of puts the thing owned or part before the owner or whole."]}},{"id":"asset_eng_grammar_possession_of_s_b1_comparison_adjective_pronoun","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"COMPARISON","title":"Possessive adjective vs possessive pronoun","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"comparison":{"compareWith":"my / your / her and mine / yours / hers","similarities":["Both types show possession.","Both refer to the owner."],"differences":["Possessive adjectives come before a noun: my book, your desk, her phone.","Possessive pronouns replace the noun phrase: mine, yours, hers.","Do not say mine book or your is blue."]}},{"id":"asset_eng_grammar_possession_of_s_b1_association","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"ASSOCIATION","title":"Useful chunks","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"association":{"relatedTopics":["eng_grammar_pronouns_subject_object_a1","eng_grammar_nouns_singular_plural_a1","eng_grammar_noun_phrases_b1"],"relatedWords":["my friend's house","the teacher's question","the students' homework","the children's books","the name of the school","the middle of the room","a friend of mine"],"note":"Practice possession as chunks first, then ask learners to explain why each form is used."}},{"id":"asset_eng_grammar_possession_of_s_b1_example_person","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXAMPLE","title":"One person","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"example":{"english":"Lily's jacket is on the chair.","translation":"Lily's jacket is on the chair.","note":"Lily is one person, so use 's."}},{"id":"asset_eng_grammar_possession_of_s_b1_example_plural","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXAMPLE","title":"Regular plural owner","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"example":{"english":"The teachers' office is on the second floor.","translation":"The teachers' office is on the second floor.","note":"Teachers is a regular plural noun ending in -s, so add only an apostrophe."}},{"id":"asset_eng_grammar_possession_of_s_b1_example_of","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXAMPLE","title":"Part of a thing","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"example":{"english":"The handle of the cup is broken.","translation":"The handle of the cup is broken.","note":"Use of because the handle is a part of a thing."}},{"id":"asset_eng_grammar_possession_of_s_b1_example_pronoun","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXAMPLE","title":"Avoid repeating nouns","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"example":{"english":"This seat is mine. That one is yours.","translation":"This seat is mine. That one is yours.","note":"Mine means my seat; yours means your seat."}},{"id":"asset_eng_grammar_possession_of_s_b1_counter_apostrophe","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"COUNTER_EXAMPLE","title":"Wrong apostrophe placement","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"counterExample":{"wrong":"The student's books are on the table. (intended meaning: books belonging to several students)","reason":"Student's means one student. For several regular plural students, use students': The students' books are on the table."}},{"id":"asset_eng_grammar_possession_of_s_b1_counter_of_person","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"COUNTER_EXAMPLE","title":"Unnatural of with a simple person owner","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"counterExample":{"wrong":"The bike of Jack is outside.","reason":"This is understandable, but Jack's bike is more natural because the owner is a person and the phrase is short."}},{"id":"asset_eng_grammar_possession_of_s_b1_counter_pronoun","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"COUNTER_EXAMPLE","title":"Wrong possessive adjective/pronoun choice","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"counterExample":{"wrong":"This is mine pencil.","reason":"Mine is a possessive pronoun and cannot come before a noun. Say: This is my pencil. Or: This pencil is mine."}},{"id":"asset_eng_grammar_possession_of_s_b1_confusion_its","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"CONFUSION","title":"Its vs it's","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"confusion":{"confusedWith":"its and it's","reason":"Its means belonging to it, as in The cat moved its tail. It's means it is or it has, as in It's cold today."}},{"id":"asset_eng_grammar_possession_of_s_b1_confusion_double_genitive","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"CONFUSION","title":"A friend of mine","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"confusion":{"confusedWith":"a friend of me, my friend, and a friend of mine","reason":"A friend of mine is correct and means one of my friends. A friend of me is incorrect. My friend can refer to a specific friend already known from context."}},{"id":"asset_eng_grammar_possession_of_s_b1_scenario","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"SCENARIO","title":"Lost and found","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"scenario":{"description":"In a school lost-and-found office, students describe objects and owners: Anna's notebook, the boys' football, the color of the bag, and a phone that is not mine but hers."}},{"id":"asset_eng_grammar_possession_of_s_b1_dialogue","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"DIALOGUE","title":"Finding the owner","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"dialogue":{"conversation":[{"speaker":"Nina","text":"Is this your umbrella?"},{"speaker":"Sam","text":"No, mine is blue. Maybe it's Emma's."},{"speaker":"Nina","text":"The name on the handle is Emma."},{"speaker":"Sam","text":"Then it must be hers."}]}},{"id":"asset_eng_grammar_possession_of_s_b1_mnemonic","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"MNEMONIC","title":"Owner, group, thing","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"mnemonic":{"method":"decision path","content":"Ask three questions: Is the owner a person or animal? Try 's. Is the owner a regular plural ending in -s? Use s'. Is it a part, feature, result, title, or abstract idea? Try of."}},{"id":"asset_eng_grammar_possession_of_s_b1_production","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"PRODUCTION","title":"Learner production prompt","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"production":{"mySentence":"Write five sentences about your classroom or family. Use one sentence with 's, one with s', one with of, one with a possessive adjective, and one with a possessive pronoun.","feedback":"Check the owner: singular person uses 's, regular plural ending in -s uses s', things and abstract part-whole ideas often use of, possessive adjectives need a following noun, and possessive pronouns stand alone.","score":5}},{"id":"asset_eng_grammar_possession_of_s_b1_extension","knowledgePointId":"eng_grammar_possession_of_s_b1","strategy":"EXTENSION","title":"Next learning steps","createdAt":"2026-08-12T14:30:00+09:00","updatedAt":null,"extension":{"nextTopics":["Compound noun phrases","Independent possessive pronouns","Double genitive: a friend of mine","Apostrophe conventions in writing","Partitive of-phrases"]}}],"availableIds":["eng_expression_fixed_expression_no_matter_what_b1","eng_grammar_article_zero_plural_general_a2","eng_grammar_clause_nominal_what_b1","eng_grammar_conjunction_even_though_b1","eng_grammar_modal_can_a2","eng_grammar_modal_could_a2","eng_grammar_modal_will_future_a2","eng_grammar_modal_would_hypothetical_b1","eng_grammar_negation_dont_a1","eng_grammar_participle_ing_clause_b1","eng_grammar_present_simple_a1","eng_grammar_pronouns_indefinite_a2","eng_grammar_pronouns_subject_object_a1","eng_grammar_question_short_answer_do_a1","eng_pragmatics_speech_act_apology_b1","eng_vocabulary_collocation_make_mistakes_a2","eng_vocabulary_phrase_a_little_bit_a2","eng_vocabulary_word_blame_b1","eng_vocabulary_word_either_negative_b1","eng_vocabulary_word_messy_a2","eng_vocabulary_word_wanna_informal_b1","eng_vocabulary_word_formation_tion_b1","eng_grammar_possession_of_s_b1","eng_grammar_prepositions_at_on_in_b1"],"names":{"eng_expression_fixed_expression_no_matter_what_b1":"固定表达 no matter + 疑问词","eng_grammar_article_zero_plural_general_a2":"零冠词：复数名词表泛指","eng_grammar_clause_nominal_what_b1":"what 引导的名词性从句","eng_grammar_conjunction_even_though_b1":"让步连词 even though","eng_grammar_modal_can_a2":"情态动词 can / can’t（能力与可能性）","eng_grammar_modal_could_a2":"情态动词 could（可能性）","eng_grammar_modal_will_future_a2":"情态动词 will 表将来（缩略形式 ’ll）","eng_grammar_modal_would_hypothetical_b1":"情态动词 would 表假设","eng_grammar_negation_dont_a1":"一般现在时否定（don’t + 动词原形）","eng_grammar_participle_ing_clause_b1":"现在分词短语作状语（-ing clause）","eng_grammar_present_simple_a1":"一般现在时（表事实、习惯与状态）","eng_grammar_pronouns_indefinite_a2":"不定代词（everything / anything）","eng_grammar_pronouns_subject_object_a1":"主格与宾格代词（I / you / me）","eng_grammar_question_short_answer_do_a1":"助动词 do 的简短回答（Yes, I do.）","eng_pragmatics_speech_act_apology_b1":"道歉与自我归责的语用表达","eng_vocabulary_collocation_make_mistakes_a2":"搭配 make mistakes（犯错）","eng_vocabulary_phrase_a_little_bit_a2":"短语 a little bit（有一点）","eng_vocabulary_word_blame_b1":"动词 blame（责怪、归咎于）","eng_vocabulary_word_either_negative_b1":"either（否定句中的“也”）","eng_vocabulary_word_messy_a2":"形容词 messy（凌乱的、麻烦的）","eng_vocabulary_word_wanna_informal_b1":"口语缩略 wanna（= want to）","eng_vocabulary_word_formation_tion_b1":"名词后缀 -tion（动词变名词）","eng_grammar_possession_of_s_b1":"Expressing possession with 's, s', of, and possessive forms","eng_grammar_prepositions_at_on_in_b1":"at / on / in 的时间和地点用法"}};
