dAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"explanation":{"myUnderstanding":"would 表示假设或虚拟的情况，常与 if 从句搭配：if 从句用过去式，主句用 would + 动词原形。它也用于委婉请求，如 Would you...?。否定式 wouldn’t 表示“不会（那样做）”。确定会发生的将来用 will，不用 would。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_comparison","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"COMPARISON","title":"Will vs would","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"comparison":{"compareWith":"will and would","similarities":["两者都是情态动词，后接动词原形，不随主语变化。","两者都可以用于提出请求或询问意愿。","两者都可以出现在条件句的主句中。"],"differences":["will 表示确定的将来、打算或承诺；would 表示假设、虚拟或更委婉的语气。","真实条件句用 if + 一般现在时 + will；非真实假设用 if + 过去式 + would。","Would you...? 比 Will you...? 更委婉、更礼貌。"]}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_association","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"ASSOCIATION","title":"Common chunks","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"association":{"relatedTopics":["eng_grammar_modal_will_future_a2","eng_grammar_modal_could_a2","eng_grammar_conditionals_b1"],"relatedWords":["would like to","would love to","would rather","would you mind","if I were you","wouldn't","I'd"],"note":"先记住这些高频词组（would like to、would rather、would you mind），再理解 would 的“假设”核心含义。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_example_hypothetical","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"EXAMPLE","title":"Hypothetical statement","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"example":{"english":"If I had more time, I would learn to play the guitar.","translation":"如果我有更多时间，我会学弹吉他。","note":"if 从句用过去式 had，主句用 would + 动词原形，表示与现在事实相反的假设。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_example_zootopia","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"EXAMPLE","title":"Evidence from Zootopia.txt","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"example":{"english":"I wouldn't forgive me either.","translation":"换作是我，我也不会原谅我自己。","note":"源自 Zootopia.txt；wouldn’t 表达在同样假设情况下自己也不会原谅自己。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_counter_condition","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"COUNTER_EXAMPLE","title":"Wrong tense in the if-clause","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"counterExample":{"wrong":"If I have more time, I would learn to play the guitar.","reason":"非真实条件句的 if 从句不能用一般现在时。正确说法是 If I had more time, I would learn to play the guitar.（从句用过去式，主句用 would）"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_counter_will","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"COUNTER_EXAMPLE","title":"Will instead of would","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"counterExample":{"wrong":"If I were you, I will ask the teacher.","reason":"这是与现在事实相反的非真实条件句，主句应使用 would 而不是 will。正确说法是 If I were you, I would ask the teacher."}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_confusion_request","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"CONFUSION","title":"Would vs could in polite requests","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"confusion":{"confusedWith":"would and could in polite requests","reason":"Would you...? 和 Could you...? 都用于礼貌请求，但 Would you...? 侧重询问对方意愿（你愿意……吗），Could you...? 侧重询问能力或可能性（你能……吗）。请求对方做事时两者都常用，但含义侧重不同。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_scenario_advice","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strategy":"SCENARIO","title":"Giving advice about trying something new","createdAt":"2026-08-14T10:00:00+09:00","updatedAt":null,"scenario":{"description":"朋友担心自己会失败，不敢尝试新事物。你给他建议：If I were you, I would try it once.（如果我是你，我会先试一次。）再设想：If she came tomorrow, we would study together.（如果她明天来，我们会一起复习。）这些场景都用 would 表达假设情况下的行动。"}},{"id":"asset_eng_grammar_modal_would_hypothetical_b1_dialogue","knowledgePointId":"eng_grammar_modal_would_hypothetical_b1","strat
