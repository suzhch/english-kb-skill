itle":"Core rule","createdAt":"2026-08-12T14:15:00+09:00","updatedAt":null,"explanation":{"myUnderstanding":"Use at for a precise point, such as a clock time or a specific place: at 7:30, at the station. Use on for a surface or a calendar day/date: on the wall, on Monday, on May 5. Use in for an enclosed or larger space and for longer time periods: in my bag, in China, in May, in 2026, in the morning."}},{"id":"asset_eng_grammar_prepositions_at_on_in_b1_comparison","knowledgePointId":"eng_grammar_prepositions_at_on_in_b1","strategy":"COMPARISON","title":"At vs on vs in","createdAt":"2026-08-12T14:15:00+09:00","updatedAt":null,"comparison":{"compareWith":"at, on, and in","similarities":["All three can show time.","All three can show place.","All three often appear before nouns or noun phrases."],"differences":["At usually points to an exact time or a specific point-like location.","On usually points to a day/date or contact with a surface.","In usually points to a longer time period or being inside an area, container, or space."]}},{"id":"asset_eng_grammar_prepositions_at_on_in_b1_association","knowledgePointId":"eng_grammar_prepositions_at_on_in_b1","strategy":"ASSOCIATION","title":"Common chunks","createdAt":"2026-08-12T14:15:00+09:00","updatedAt":null,"association":{"relatedTopics":["eng_grammar_prepositions_place_a2","eng_grammar_prepositions_time_a2","eng_vocabulary_daily_routines_a2"],"relatedWords":["at 7 o'clock","at noon","at school","on Monday","on May 5","on the desk","in the morning","in 2026","in my bag"],"note":"Teach these as useful chunks first, then connect them to the general rule of point, surface/day, and area/period."}},{"id":"asset_eng_grammar_prepositions_at_on_in_b1_example_time_exact","knowledgePointId":"eng_grammar_prepositions_at_on_in_b1","strategy":"EXAMPLE","title":"Exact time","createdAt":"2026-08-12T14:15:00+09:00","updatedAt":null,"example":{"english":"The lesson starts at 8:20.","translation":"This lesson starts at eight twenty.","no
